<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070a0e" />
  <title>MANHUNT // PROTOCOL</title>
</head>
<body style="margin:0;background:#070a0e;color:#34d399;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh">
  <div id="msg">LOADING MANHUNT // PROTOCOL...</div>
  <script>
    (async function () {
      var SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
      try {
        var res = await Promise.all(['index.html', 'contracts.js', 'multiplayer.js'].map(function (u) {
          return fetch(u, { cache: 'no-cache' }).then(function (r) {
            if (!r.ok) throw new Error(u + ' failed (' + r.status + ')');
            return r.text();
          });
        }));
        var page = res[0], ctJs = res[1], mpJs = res[2];
        var out = page
          .replace('</head>', function () { return '<script src="' + SUPABASE_JS + '"><\/script></head>'; })
          .replace(/<\/body>\s*<\/html>\s*$/i, function () { return '<script>' + ctJs + '<\/script><script>' + mpJs + '<\/script></body></html>'; });
        document.open();
        document.write(out);
        document.close();
      } catch (e) {
        document.getElementById('msg').textContent = 'Load error: ' + e.message;
      }
    })();
  </script>
</body>
</html>
